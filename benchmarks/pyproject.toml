[project]
name = "language-bot-benchmarks"
version = "0.1.0"
description = "Isolated M1 CPU model feasibility experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2,<2",
    "piper-tts>=1.3,<2",
    "transformers>=4.50,<5",
    "torch>=2.6,<3",
    "sentencepiece>=0.2,<0.3",
    "sacremoses>=0.1,<0.2",
    "huggingface-hub>=0.30,<1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
