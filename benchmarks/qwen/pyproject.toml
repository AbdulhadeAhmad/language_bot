[project]
name = "language-bot-qwen-benchmark"
version = "0.1.0"
description = "Isolated CPU Qwen3-TTS feasibility experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qwen-tts==0.1.1",
    "torch>=2.6,<3",
    "torchaudio>=2.6,<3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
