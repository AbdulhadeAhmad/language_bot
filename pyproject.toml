[project]
name = "language-bot"
version = "0.1.0"
description = "Async Telegram German sentence library"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.8,<3",
    "pytelegrambotapi>=4.27,<5",
    "aiohttp>=3.11,<4",
    "httpx>=0.28,<1",
    "fsrs==6.3.1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
language-bot-api = "app.main:run"
language-bot-model = "app.inference.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.optional-dependencies]
inference = [
    "faster-whisper==1.2.1", "av==18.1.0", "piper-tts==1.8.0",
    "transformers==4.57.6", "torch==2.15.0", "sentencepiece==0.2.2",
    "sacremoses==0.1.1", "huggingface-hub==0.36.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
