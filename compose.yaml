name: language-bot
x-app: &app
  build: .
  env_file: ${LANGUAGE_BOT_DATA_DIR:-${HOME}/language_bot_data}/.env
  environment:
    LANGUAGE_BOT_DATA_DIR: /data
    TMPDIR: /data/tmp
    XDG_CACHE_HOME: /data/cache
  volumes:
    - ${LANGUAGE_BOT_DATA_DIR:-${HOME}/language_bot_data}/tmp:/data/tmp
    - ${LANGUAGE_BOT_DATA_DIR:-${HOME}/language_bot_data}/cache/app:/data/cache
    - ${LANGUAGE_BOT_DATA_DIR:-${HOME}/language_bot_data}/logs:/data/logs
  init: true
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  db:
    image: postgres:16-bookworm
    env_file: ${LANGUAGE_BOT_DATA_DIR:-${HOME}/language_bot_data}/.env
    environment:
      POSTGRES_USER: language_bot
      POSTGRES_DB: language_bot
    volumes:
      - ${LANGUAGE_BOT_DATA_DIR:-${HOME}/language_bot_data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U language_bot -d language_bot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    env_file: ${LANGUAGE_BOT_DATA_DIR:-${HOME}/language_bot_data}/.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    <<: *app
    ports:
      - "127.0.0.1:8060:8060"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8060/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
  interaction-worker:
    <<: *app
    command: ["language-bot-worker", "--role", "interactions"]
  delivery-worker:
    <<: *app
    command: ["language-bot-worker", "--role", "deliveries"]
